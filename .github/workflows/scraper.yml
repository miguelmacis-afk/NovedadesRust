name: YouTube Discord Scraper

on:
  schedule:
    - cron: '*/30 * * * *' # Ejecuta el bot cada 30 minutos
  workflow_dispatch: # Permite ejecutar el script manualmente desde GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso necesario para hacer commit y push

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Ejecutar Scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scraper.py

      - name: Guardar historial en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Asegurar que el archivo existe
          touch sent_videos.txt
          git add sent_videos.txt
          
          # Hacer commit PRIMERO para limpiar el index, luego pull --rebase y push
          if ! git diff --staged --quiet; then
            git commit -m "chore: actualizar registro de vídeos [skip ci]"
            git pull --rebase origin main
            git push
          fi
